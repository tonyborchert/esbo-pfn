# Pre-generated training and validation data (docs/DATA.md).
#
# Ids have the form <kind>/<problem>/<name>. An entry whose key contains {p} is expanded for every
# problem in `problems` (or only for the problems it lists). Pools live under
# $PFN_HOME/datasets/<problem>/<kind>/<name>/. A `prefix_of` entry owns no directory: it is the first
# `count` units of another dataset, generated by generating that dataset's first chunks.
#
# count  units of the dataset: rows (traj), screened instances (sets, screen), examples (contexts)
# seed   root seed, chunk k is generated from derive_seed(seed, k)
# chunk  units per chunk, the unit of parallelism, resumption and sharding
#
# Validation sets use their own seed streams, never a slice of a training pool.

problems: [boiler, threetank_pi, pt2_deadtime, cartpole, furuta]

datasets:
  traj/{p}/1M:
    kind: traj
    count: 1000000
    seed: 1001
    chunk: 10000
    description: single-trajectory prior, training pool of the 1M LC-PFN and DecPFN models
  traj/{p}/100k:
    prefix_of: traj/{p}/1M
    count: 100000
    description: first 100,000 rows of traj/{p}/1M, training pool of the 100k models
  traj/{p}/val:
    kind: traj
    count: 3000
    seed: 1002
    chunk: 1000
    description: single-trajectory validation set of DecPFN (separate seed stream)
  traj/{p}/val_lcpfn:
    prefix_of: traj/{p}/val
    count: 1024
    description: LC-PFN validation set, the first 1,024 rows of traj/{p}/val
  traj/{p}/1M_nodeadtime:
    problems: [furuta]
    kind: traj
    count: 1000000
    seed: 1003
    chunk: 10000
    options: {dead_time: false}
    description: Furuta prior without actuation dead time (hardware prediction ablation)
  traj/{p}/val_nodeadtime:
    problems: [furuta]
    kind: traj
    count: 3000
    seed: 1004
    chunk: 1000
    options: {dead_time: false}
    description: validation set of the prior without actuation dead time
  sets/{p}/xdecpfn:
    kind: sets
    count: 132400
    seed: 2001
    chunk: 100
    options: {resolution: grid, labels: 128}
    description: >-
      XDecPFN pools, one screened instance with N_max trajectories per unit (counts of crashed,
      unsuccessful and successful trajectories drawn once with n = N_max), stored on the decoder
      grid, plus 128 unrun label trials per instance
  sets/{p}/xdecpfn_heldout:
    kind: sets
    count: 256
    seed: 2002
    chunk: 32
    options: {resolution: grid, labels: 128}
    description: held-out XDecPFN pools
  contexts/{p}/ftpfn:
    kind: contexts
    count: 3500000
    seed: 3001
    chunk: 2000
    options: {n_unrun: 16}
    description: FT-PFN examples, a fresh screened instance and trajectory set per example, pre-tokenized
  contexts/{p}/ftpfn_heldout:
    kind: contexts
    count: 2000
    seed: 3002
    chunk: 500
    options: {n_unrun: 16}
    description: held-out FT-PFN examples
  fields/{p}/oracle65:
    kind: fields
    placeholder: true
    description: ESBO-Oracle runs of 65 trials on screened instances (prediction benchmark queries), written by the `fields` benchmark units (pfn bench run --kind fields)
  fields/{p}/oracle181:
    kind: fields
    placeholder: true
    description: ESBO-Oracle runs of N_max + 1 trials (context ladder queries), written by the `fields` benchmark units (pfn bench run --kind fields)

# Datasets each trainable model needs (pfn data gen --for train <model> --problem <p>).
models:
  lcpfn: ["traj/{p}/1M", "traj/{p}/val_lcpfn"]
  lcpfn-last: ["traj/{p}/1M", "traj/{p}/val_lcpfn"]
  decpfn: ["traj/{p}/1M", "traj/{p}/val"]
  decpfn-nostates: ["traj/{p}/1M", "traj/{p}/val"]
  decpfn-nodeadtime: ["traj/{p}/1M_nodeadtime", "traj/{p}/val_nodeadtime"]
  decpfn-nodeadtime-nostates: ["traj/{p}/1M_nodeadtime", "traj/{p}/val_nodeadtime"]
  xdecpfn: ["sets/{p}/xdecpfn", "sets/{p}/xdecpfn_heldout"]
  ftpfn: ["contexts/{p}/ftpfn", "contexts/{p}/ftpfn_heldout"]
