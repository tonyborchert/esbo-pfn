[project]
name = "esbo-pfn"
version = "0.1.0"
description = "Early stopping Bayesian optimization for controller tuning with prior-fitted networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tony Borchert" }]
requires-python = ">=3.12,<3.13"
keywords = ["bayesian optimization", "early stopping", "prior-fitted networks", "controller tuning",
            "furuta pendulum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "pyyaml",
    "pandas",
    "pyarrow",
    "matplotlib",
    "tabpfn",
    "websockets",
    "pytest",
]

[project.urls]
# placeholders, set to the published repository
Repository = "https://github.com/OWNER/esbo-pfn"
Documentation = "https://github.com/OWNER/esbo-pfn/tree/main/docs"

[project.scripts]
pfn = "esbopfn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esbopfn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: pure Python tests that run in seconds on a laptop (default)",
    "cpp: needs the C++ generator binaries (--run-cpp or binaries found)",
    "gpu: needs a CUDA or MPS device (--run-gpu or device found)",
    "slurm: needs sbatch on PATH (--run-slurm or sbatch found)",
    "hardware: needs a reachable rig server (--run-hardware only)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# zip() without strict= and small named lambdas are accepted style here
ignore = ["B905", "E731"]

[tool.ruff.lint.pycodestyle]
# new code is formatted to 100 columns, existing hand-wrapped lines may run to 120
max-line-length = 120

[tool.ruff.lint.flake8-bugbear]
# frozen dataclasses used as argument defaults
extend-immutable-calls = ["esbopfn.benchmarks.runner.Shard", "esbopfn.problems.prior.Pilot"]
